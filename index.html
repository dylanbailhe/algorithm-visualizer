<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <canvas id="gridCanvas" aria-label="Algorithm visualization"></canvas>
    <button id="togglePanelBtn" type="button" aria-controls="controlPanel" aria-expanded="true">Hide Controls</button>
    <aside id="controlPanel" class="control-panel">
      <header class="panel-header">
        <h1>Algorithm Visualizer</h1>
        <p id="algorithmSubtitle">Conway's Game of Life</p>
      </header>
      <div class="algorithm-controls">
<label for="algorithmSelect">Algorithm</label>
<select id="algorithmSelect">
<option value="life">Conway's Game of Life</option>
<option value="cyclic">Cyclic Cellular Automata</option>
<option value="reaction">Reaction-Diffusion</option>
<option value="maze">Maze Generation</option>
<option value="noise">Procedural Noise</option>
<option value="dla">Diffusion-Limited Aggregation</option>
<option value="ant">Langton's Ant</option>
<option value="wfc">Wave Function Collapse</option>
<option value="boids">Boids (Flocking Simulation)</option>
</select>
</div>
      <div class="pattern-controls">
<select id="patternSelect">
<option value="glider">Glider</option>
<option value="blinker">Blinker</option>
<option value="toad">Toad</option>
</select>
<button id="loadPatternBtn">Load Pattern</button>
</div>
      <div class="settings">
      <div class="setting">
<label for="speedSlider">Simulation Speed</label>
<input id="speedSlider" max="30" min="1" type="range" value="10"/>
<span id="speedValue">10 generations/sec</span>
</div>
<div class="setting">
<label for="gridSizeSelect">Grid Size</label>
<select id="gridSizeSelect">
<option value="30">30 × 30</option>
<option selected="" value="60">60 × 60</option>
<option value="100">100 × 100</option>
<option value="150">150 × 150</option>
</select>
</div>
<div class="setting" id="stateSetting">
<label for="stateSlider">Color States</label>
<input id="stateSlider" max="32" min="3" type="range" value="16"/>
<span id="stateValue">16 states</span>
</div>
<div class="setting" id="feedSetting">
<label for="feedSlider">Feed Rate</label>
<input id="feedSlider" max="0.09" min="0.01" step="0.001" type="range" value="0.055"/>
<span id="feedValue">0.055</span>
</div>
<div class="setting" id="killSetting">
<label for="killSlider">Kill Rate</label>
<input id="killSlider" max="0.075" min="0.03" step="0.001" type="range" value="0.062"/>
<span id="killValue">0.062</span>
</div>
<div class="setting" id="paletteSetting">
<label for="paletteSelect">Color Palette</label>
<select id="paletteSelect">
<option value="ocean">Ocean Blue</option>
<option value="rainbow">Rainbow</option>
<option value="grayscale">Grayscale</option>
<option value="heat">Heat Map</option>
</select>
</div>
<div class="setting" id="mazeComplexitySetting" style="display:none;">
<label for="mazeComplexitySlider">
    Extra Maze Connections
  </label>
<input id="mazeComplexitySlider" max="30" min="0" step="1" type="range" value="0"/>
<span id="mazeComplexityValue">0%</span>
</div>
<div class="setting" id="noiseScaleSetting" style="display:none;">
<label for="noiseScaleSlider">Noise Scale</label>
<input id="noiseScaleSlider" max="0.30" min="0.01" step="0.005" type="range" value="0.08"/>
<span id="noiseScaleValue">0.080</span>
</div>
<div class="setting" id="noiseDisplaySetting" style="display:none;">
<label for="noiseDisplaySelect">Display Mode</label>
<select id="noiseDisplaySelect">
<option value="texture">Noise Texture</option>
<option value="vectors">Vector Field</option>
<option value="particles">Particle Flow</option>
</select>
</div>
<div class="setting" id="antRuleSetting"
     style="display:none;">

  <label for="antRuleSelect">Ant Rules</label>

  <select id="antRuleSelect">
    <option value="RL">Classic (RL)</option>
    <option value="RLLR">Multicolor (RLLR)</option>
    <option value="LLRR">Symmetric (LLRR)</option>
    <option value="LRRRRRLLR">Complex (LRRRRRLLR)</option>
  </select>

</div>

<div class="setting" id="wfcTileSetting"
     style="display:none;">

  <label for="wfcTileSelect">WFC Tile Set</label>

  <select id="wfcTileSelect">
    <option value="circuit">Circuit Network</option>
    <option value="maze">Maze Paths</option>
    <option value="sparse">Sparse Circuits</option>
  </select>

</div>

<!-- Boids Controls -->
<div class="setting" id="boidsSeparationSetting"
     style="display:none;">
  <label for="separationSlider">Separation</label>
  <input
    type="range"
    id="separationSlider"
    min="0"
    max="5"
    step="0.1"
    value="1.5"
  >
  <span id="separationValue">1.5</span>
</div>

<div class="setting" id="boidsAlignmentSetting"
     style="display:none;">
  <label for="alignmentSlider">Alignment</label>
  <input
    type="range"
    id="alignmentSlider"
    min="0"
    max="5"
    step="0.1"
    value="1.0"
  >
  <span id="alignmentValue">1.0</span>
</div>

<div class="setting" id="boidsCohesionSetting"
     style="display:none;">
  <label for="cohesionSlider">Cohesion</label>
  <input
    type="range"
    id="cohesionSlider"
    min="0"
    max="5"
    step="0.1"
    value="1.0"
  >
  <span id="cohesionValue">1.0</span>
</div>

<div class="setting" id="boidsMouseSetting"
     style="display:none;">

  <label for="boidsMouseSelect">
    Mouse Interaction
  </label>

  <select id="boidsMouseSelect">
    <option value="off">Off</option>
    <option value="repel">Repel</option>
    <option value="attract">Attract</option>
  </select>

</div>

</div>
      </div>
      <div class="pathfinding-controls" id="pathfindingControls" style="display:none;">
<label for="pathfindingSelect">
    Pathfinding Algorithm
  </label>
<select id="pathfindingSelect">
<option value="bfs">Breadth-First Search (BFS)</option>
<option value="dfs">Depth-First Search (DFS)</option>
<option value="astar">A* Search (A-Star)</option>
</select>
</div>
<div class="controls">
<button id="startBtn">Start</button>
<button id="stepBtn">Step</button>
<button id="randomBtn">Randomize</button>
<button id="clearBtn">Clear</button>
<button id="solveMazeBtn" style="display:none;">
    Solve Maze
  </button>
</div>
<div class="path-stats" id="pathStats" style="display:none;">
<h3>Pathfinding Statistics</h3>
<div class="stats-grid">
<div class="stat">
<span id="cellsExplored">0</span>
<label>Cells Explored</label>
</div>
<div class="stat">
<span id="pathLength">—</span>
<label>Path Length</label>
</div>
<div class="stat">
<span id="searchTime">0.00 ms</span>
<label>Search Time</label>
</div>
</div>
</div>
<p id="generation">Generation: 0</p>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
